# HALO Stage-1 style hidden-state alignment for Full:SWA = 1:3 hybrid + TTT.
# This warmup aligns selected student decoder-layer outputs to a frozen
# full-attention Qwen3 teacher before the Stage-2 KL run.

model:
  model_path: /zouxiangyu/models/Qwen/Qwen3-4B
  tokenizer_path: /zouxiangyu/models/Qwen/Qwen3-4B
  foundation:
    max_position_embeddings: 131072
    rope_theta: 5000000.0
    # HALO-style 9 full-attention anchors + 27 SWA layers.
    full_attention_layers: [0, 1, 7, 14, 15, 22, 24, 31, 33]
    # Keep the same TTT placement as the LongSFT/KD experiments.
    ttt_layers: [3, 6, 12, 18, 25, 30]
    ttt_mode: true
    ttt_proj: true
    ttt_lr: 5
    ttt_chunk: 1024
    ttt_target: input_embed
    ttt_compress_window: 4096
    # Hidden alignment is the only warmup objective in this stage.
    ttt_aux_loss_weight: 0.0
    # Frozen full-attention teacher. Override with TEACHER_MODEL_PATH in the script.
    hidden_align_teacher_path: /zouxiangyu/models/Qwen/Qwen3-4B
    hidden_align_loss_fn: mse
    # null means all converted layers, i.e. all non-full-attention student layers.
    hidden_align_layers: null
    hidden_align_skip_ttt_layers: false
    # FSDP-friendly default: train whole selected decoder layers.
    # Use "self_attn" if you want closer token-mixer-only HALO behavior.
    hidden_align_train_scope: layers

data:
  train_path: /zouxiangyu/data_ttt/long-sft/train.jsonl
  eval_path: /zouxiangyu/data_ttt/long-sft/val.jsonl
  dataloader_type: native
  datasets_type: iterable
  data_type: conversation
  chat_template: chatml
  # HALO Stage 1 is short-context alignment; override MAX_SEQ_LEN for ablations.
  max_seq_len: 512
  text_keys: messages
  drop_last: true

train:
  output_dir: /zouxiangyu/codes/Learning/In-Place-TTT/outputs/longsft-swa-full-halo-1to3-hidden-align-swa4096-chunk1024-512
  load_checkpoint_path: "auto"
  data_parallel_mode: fsdp2
  ulysses_parallel_size: 1
  global_batch_size: 32
  micro_batch_size: 1
  rmpad: false
  use_wandb: true
  wandb_project: in-place-ttt
  wandb_name: longsft-swa-full-halo-1to3-hidden-align-swa4096-chunk1024-512
  max_steps: 8000
  rmpad_with_pos_ids: false
  dyn_bsz_margin: 0
  dyn_bsz: false
  optimizer: adamw
  lr: 1.0e-4
  lr_warmup_ratio: 0.05
  lr_decay_style: cosine
  lr_decay_ratio: 0.90
  weight_decay: 0.1
  max_grad_norm: 1.0
  enable_mixed_precision: true
  enable_gradient_checkpointing: true
  enable_full_shard: true
  init_device: meta
  ckpt_manager: dcp
  save_steps: 1000
  eval_steps: 100
  eval_batches: 100
  save_hf_weights: false
