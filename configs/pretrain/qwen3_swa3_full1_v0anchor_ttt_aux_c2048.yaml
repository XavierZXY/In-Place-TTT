# V0-aligned Full:SWA = 1:3 hybrid + In-Place TTT on SWA layers only.
# Launched by scripts/train/longsft/run_swa3_full1_v0anchor_ttt_aux_c2048.sh.

model:
  model_path: /zouxiangyu/models/Qwen/Qwen3-4B
  tokenizer_path: /zouxiangyu/models/Qwen/Qwen3-4B
  foundation:
    max_position_embeddings: 131072
    rope_theta: 5000000.0
    # V0 anchor layout: 9 full-attention layers + 27 SWA layers.
    full_attention_layers: [0, 1, 7, 14, 15, 22, 24, 33, 34]
    # V0 SWA-only TTT placement. None of these layers are full-attention anchors.
    ttt_layers: [3, 6, 12, 18, 25, 30]
    ttt_mode: true
    ttt_proj: true
    ttt_lr: 5
    ttt_chunk: 2048
    ttt_target: input_embed
    ttt_compress_window: 4096
    ttt_aux_loss_weight: 0.1

data:
  train_path: /zouxiangyu/data_ttt/long-sft/train.jsonl
  eval_path: /zouxiangyu/data_ttt/long-sft/val.jsonl
  dataloader_type: native
  datasets_type: iterable
  data_type: conversation
  chat_template: chatml
  max_seq_len: 32768
  text_keys: messages
  drop_last: true

train:
  output_dir: /zouxiangyu/codes/Learning/In-Place-TTT/outputs/qwen3-swa3-full1-v0anchor-ttt-aux-c2048-32k
  load_checkpoint_path: "auto"
  data_parallel_mode: fsdp2
  ulysses_parallel_size: 1
  global_batch_size: 32
  micro_batch_size: 1
  rmpad: false
  use_wandb: true
  wandb_project: in-place-ttt
  wandb_name: qwen3-swa3-full1-v0anchor-ttt-aux-c2048-32k
  max_steps: 8000
  rmpad_with_pos_ids: false
  dyn_bsz_margin: 0
  dyn_bsz: false
  optimizer: adamw
  lr: 5.0e-5
  lr_warmup_ratio: 0.05
  lr_decay_style: cosine
  lr_decay_ratio: 0.90
  weight_decay: 0.1
  max_grad_norm: 1.0
  enable_mixed_precision: true
  enable_gradient_checkpointing: true
  enable_full_shard: true
  init_device: meta
  ckpt_manager: dcp
  save_steps: 1000
  eval_steps: 100
  eval_batches: 500
  save_hf_weights: false
