# Qwen3-1.7B Stage 1: hidden-state alignment for strict Full:SWA = 1:3.
# This aligns selected student decoder-layer outputs to a frozen full-attention teacher.

model:
  model_path: /zouxiangyu/models/Qwen/Qwen3-1.7B
  tokenizer_path: /zouxiangyu/models/Qwen/Qwen3-1.7B
  foundation:
    # Keep student RoPE identical to the frozen teacher so the alignment loss
    # only reflects the SWA layout difference.
    max_position_embeddings: 40960
    rope_theta: 1000000.0
    # Strict 1:3 layout over 28 Qwen3-1.7B layers.
    # full_attention_layers: [0, 4, 8, 12, 16, 20, 24]
    full_attention_layers: []
    # Stage 1 uses SWA/Full layout only; TTT modules are not instantiated.
    ttt_layers: []
    ttt_mode: false
    ttt_compress_window: 1024
    # Hidden alignment is the only objective in this stage.
    ttt_aux_loss_weight: 0.0
    hidden_align_teacher_path: /zouxiangyu/models/Qwen/Qwen3-1.7B
    hidden_align_loss_fn: nmse
    # Each aligned student layer consumes the teacher's previous-layer output,
    # so per-layer losses measure local SWA error without upstream compounding.
    hidden_align_input: teacher
    hidden_align_layers: null
    hidden_align_skip_ttt_layers: false
    hidden_align_train_scope: layers

data:
  train_path: /zouxiangyu/data_ttt/long-sft/train.jsonl
  eval_path: /zouxiangyu/data_ttt/long-sft/val.jsonl
  dataloader_type: native
  datasets_type: iterable
  data_type: conversation
  chat_template: chatml
  # Must exceed ttt_compress_window so SWA layers actually diverge from the
  # full-attention teacher.
  max_seq_len: 4096
  text_keys: messages
  drop_last: true

train:
  output_dir: /zouxiangyu/codes/Learning/In-Place-TTT/outputs/qwen3-1.7b-stage1-hidden-align-swa3-full1-strict-4096
  load_checkpoint_path: "auto"
  data_parallel_mode: fsdp2
  ulysses_parallel_size: 1
  global_batch_size: 128
  micro_batch_size: 4
  rmpad: false
  use_wandb: true
  wandb_project: in-place-ttt-mini
  wandb_name: qwen3-1.7b-stage1-hidden-align-swa3-full1-strict-4096
  max_steps: 20000
  # Keep at 1: the dataloader recycles data internally, and the LR scheduler
  # horizon is train_steps * num_train_epochs — larger values push warmup and
  # decay far beyond stage_stop_steps.
  num_train_epochs: 1
  stage_stop_steps: 20000
  rmpad_with_pos_ids: false
  dyn_bsz_margin: 0
  dyn_bsz: false
  optimizer: adamw
  lr: 2.0e-5
  lr_min: 2.0e-6
  lr_warmup_ratio: 0.05
  lr_decay_style: cosine
  lr_decay_ratio: 0.90
  weight_decay: 0.1
  max_grad_norm: 1.0
  enable_mixed_precision: true
  enable_gradient_checkpointing: true
  enable_full_shard: true
  init_device: meta
  ckpt_manager: dcp
  save_steps: 2000
  eval_steps: 1000
  eval_batches: 100
  save_hf_weights: false
