# Qwen3-1.7B Stage 3: CPT for strict Full:SWA = 1:3 hybrid + In-Place TTT.
# Layout: 0 full, 1/2/3 SWA, then repeat every 4 layers.

model:
  # Initialize from the stage-2 KD weights (converted to HF format by the
  # launch script). Plain weight loading; TTT modules are new and randomly
  # initialized. The launch script auto-detects the latest stage-2 checkpoint
  # and overrides this path.
  model_path: /zouxiangyu/codes/Learning/In-Place-TTT/outputs/qwen3-1.7b-stage2-kd-swa3-full1-strict-4096/checkpoints/global_step_8000/hf_ckpt
  tokenizer_path: /zouxiangyu/models/Qwen/Qwen3-1.7B
  foundation:
    # Keep RoPE identical to stages 1/2: the backbone is frozen in this stage
    # (ttt_train_only) and cannot compensate for a positional-encoding change.
    max_position_embeddings: 131072
    rope_theta: 3260000.0
    # Strict 1:3 layout over 28 Qwen3-1.7B layers.
    # full_attention_layers: [0, 4, 8, 12, 16, 20, 24]
    full_attention_layers: []
    # First SWA layer after each full-attention anchor.
    # ttt_layers: [1, 5, 9, 13, 17, 21, 25]
    ttt_layers: [4, 10, 14, 17, 22, 26]
    ttt_mode: true
    ttt_proj: true
    ttt_lr: 3
    # Chunk == SWA window: the TTT fast-weight memory becomes available
    # exactly where the sliding window ends.
    ttt_chunk: 1024
    ttt_target: input_embed
    # Must match the window stages 1/2 were aligned with.
    ttt_compress_window: 1024
    # Pure CE training for TTT modules; keep aux disabled.
    ttt_aux_loss_weight: 1.0
    # Train only ttt_conv/ttt_proj; the aligned backbone stays frozen so the
    # short-context behavior from stages 1/2 is preserved exactly.
    ttt_train_only: false

data:
  train_path: /workspace/cogagent_cloud/zxy/data/TTT/ultrafineweb-ruler-v2-sft-4k64k-200k/train.jsonl
  eval_path: /workspace/cogagent_cloud/zxy/data/TTT/ultrafineweb-ruler-v2-sft-4k64k-200k/val.jsonl
  dataloader_type: native
  datasets_type: iterable
  data_type: conversation
  chat_template: chatml
  # Train at 16k; eval extrapolates to 32k (2x chunks) to directly measure
  # the TTT fast-weight memory's length generalization.
  max_seq_len: 65536
  eval_max_seq_len: 73728
  text_keys: messages
  drop_last: true

train:
  output_dir: /zouxiangyu/codes/Learning/In-Place-TTT/outputs/qwen3-1.7b-stage3-cpt-swa3-full1-strict-c1024-64k
  load_checkpoint_path: "auto"
  data_parallel_mode: fsdp2
  ulysses_parallel_size: 1
  global_batch_size: 32
  micro_batch_size: 1
  rmpad: false
  use_wandb: true
  wandb_project: in-place-ttt-mini
  wandb_name: qwen3-1.7b-stage3-cpt-swa3-full1-strict-c1024-64k
  max_steps: 10000
  rmpad_with_pos_ids: false
  dyn_bsz_margin: 0
  dyn_bsz: false
  optimizer: adamw
  lr: 5.0e-5
  lr_min: 5.0e-5
  lr_warmup_ratio: 0.05
  lr_decay_style: constant
  lr_decay_ratio: 1.0
  weight_decay: 0.1
  max_grad_norm: 1.0
  enable_mixed_precision: true
  enable_gradient_checkpointing: true
  enable_full_shard: true
  init_device: meta
  ckpt_manager: dcp
  save_steps: 3000
  eval_steps: 30000
  eval_batches: 1
  save_hf_weights: false
