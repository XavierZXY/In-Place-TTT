# Qwen3-1.7B Stage 2: KD alignment for strict Full:SWA = 1:3.
# This stage distills logits from a frozen full-attention teacher.

model:
  # Initialize from the stage-1 aligned weights (converted to HF format by the
  # launch script via scripts/merge_dcp_to_hf.py). Plain weight loading — no
  # optimizer/step state is carried over from stage 1. The launch script
  # auto-detects the latest stage-1 checkpoint and overrides this path.
  model_path: /zouxiangyu/codes/Learning/In-Place-TTT/outputs/qwen3-1.7b-stage1-hidden-align-swa3-full1-strict-4096/checkpoints/global_step_5044/hf_ckpt
  tokenizer_path: /zouxiangyu/models/Qwen/Qwen3-1.7B
  foundation:
    # Keep student RoPE identical to the teacher and to stage 1.
    max_position_embeddings: 40960
    rope_theta: 1000000.0
    # Strict 1:3 layout over 28 Qwen3-1.7B layers.
    # full_attention_layers: [0, 4, 8, 12, 16, 20, 24]
    full_attention_layers: []
    # Stage 2 uses SWA/Full layout only; TTT modules are not instantiated.
    ttt_layers: []
    ttt_mode: false
    # Must match stage 1 (the architecture being distilled) and stay below
    # max_seq_len, otherwise SWA degenerates into full attention.
    ttt_compress_window: 1024
    # KD is the only objective in this stage.
    ttt_aux_loss_weight: 0.0
    distill_teacher_path: /zouxiangyu/models/Qwen/Qwen3-1.7B
    distill_alpha_ce: 0.0
    distill_alpha_kl: 1.0
    distill_temperature: 1.0
    distill_chunk_size: 128

data:
  train_path: /zouxiangyu/data_ttt/long-sft/train.jsonl
  eval_path: /zouxiangyu/data_ttt/long-sft/val.jsonl
  dataloader_type: native
  datasets_type: iterable
  data_type: conversation
  chat_template: chatml
  max_seq_len: 4096
  text_keys: messages
  drop_last: true

train:
  output_dir: /zouxiangyu/codes/Learning/In-Place-TTT/outputs/qwen3-1.7b-stage2-kd-swa3-full1-strict-4096
  load_checkpoint_path: "auto"
  data_parallel_mode: fsdp2
  ulysses_parallel_size: 1
  global_batch_size: 32
  micro_batch_size: 1
  rmpad: false
  use_wandb: true
  wandb_project: in-place-ttt-mini
  wandb_name: qwen3-1.7b-stage2-kd-swa3-full1-strict-4096
  max_steps: 8000
  rmpad_with_pos_ids: false
  dyn_bsz_margin: 0
  dyn_bsz: false
  optimizer: adamw
  lr: 5.0e-5
  lr_min: 1.0e-5
  lr_warmup_ratio: 0.05
  lr_decay_style: cosine
  lr_decay_ratio: 0.90
  weight_decay: 0.1
  max_grad_norm: 1.0
  enable_mixed_precision: true
  enable_gradient_checkpointing: true
  enable_full_shard: true
  init_device: meta
  ckpt_manager: dcp
  save_steps: 1000
  eval_steps: 100
  eval_batches: 100
  save_hf_weights: false
